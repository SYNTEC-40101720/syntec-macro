name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and diagnostic docs check
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: 3.x release readiness gate (informational)
        # 对照 docs/Rust-Wasm切换验收门禁.md §5「完成定义」7 项门禁。
        # PR 阶段非门禁 (informational only)：任一 FAIL 仅在 actions log 打印
        # warning，不 fail job，便于及早发现 parity 文档 marker 漂移、资产
        # 完整性失败、CI 矩阵缺失等发布阻塞项。release.yml 中的 --strict
        # 硬门禁仍保留作发布收口最终判定。
        run: npm run check:release:readiness
        continue-on-error: true

      - name: 诊断规则科学化治理 (informational)
        # 对照 docs/迭代优化计划.md §4 + docs/macro-knowledge/诊断规则科学化工作流.md。
        # PR 阶段非门禁 (informational only)：HARD 缺口仅打 warning 不 fail job。
        # 发布收口由 release.yml 的 --strict 跑; SOFT 缺口 (DIAGNOSTIC_HELP 文案) 不阻塞。
        run: npm run check:diagnostic-governance
        continue-on-error: true

  integration:
    name: VS Code integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run VS Code integration tests
        run: xvfb-run -a npm run test:integration

      - name: Upload VS Code integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-integration-logs
          path: |
            .vscode-test/user-data/logs/**
            .vscode-test/**/*.log
          if-no-files-found: warn
          retention-days: 7