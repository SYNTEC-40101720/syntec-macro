name: Rust/Wasm

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build wasm + asset parity + probes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # P1 第 3 项 跨平台矩阵：开发机 Windows + CI 主力 Ubuntu。
        # Wasm artifact 字节级不在跨平台之间硬性等价（不同 toolchain 的
        # 路径依赖差异，详见 manifest audit 步骤注释）；本矩阵只确认两个
        # 平台都能构建、资产完整性校验通过、parity 与 benchmark 等价。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/syntec-core/target
          key: rust-wasm-${{ runner.os }}-${{ hashFiles('crates/syntec-core/Cargo.toml', 'crates/syntec-core/src/**') }}
          restore-keys: rust-wasm-${{ runner.os }}-

      - name: Build wasm artifact (release)
        working-directory: crates/syntec-core
        run: cargo build --release --lib --target wasm32-unknown-unknown

      - name: Build Rust CLI for compare:rust
        working-directory: crates/syntec-core
        run: cargo build --bin syntec-core-cli

      - name: Refresh production wasm asset + manifest
        run: npm run build:rust:wasm:asset

      - name: Verify asset integrity (manifest + SHA-256)
        run: npm run check:rust:wasm:asset

      - name: Report platform-specific SHA-256 (audit only)
        run: |
          sha256sum assets/rust-wasm/syntec_core.wasm
          echo "::notice::Wasm artifact SHA-256 reported above (platform-specific; cross-platform byte equality is not a WASM invariant)"
        # 跨平台 byte-equality 不是 WASM 不变量：不同 toolchain（stable
        # vs GNU/MSVC 本机构建）会在 limit/路径依赖项上产生不同字节，但
        # 都通过同一 manifest 的 SHA 校验。本步骤只在 CI 上报 SHA 作为
        # 审计证据，不阻塞构建。drift 检查留待本机 build:rust:wasm:asset
        # 后由开发者复核。

      - name: AssetsInRustWasmAssetLoader telemetry contract tests
        run: node --test tests/rustWasmAsset.test.js tests/rustWasmWorkerAdapter.test.js tests/rustWasmAdapter.test.js

      - name: Run Rust parity diff suite
        # v4.2.0 (2026-09-23) 重建为 Rust 自洽 golden file: baseline fixture
        # (tests/fixtures/rust-parity-baseline.json) 由 export:rust:baseline
        # 跑 Rust CLI 生成并 commit, compare:rust 再跑 Rust CLI 比对, 守卫
        # Rust 核心无静默回归 (R1.2 后无 JS 真源). fixture 已随仓库 commit,
        # CI 无需重新生成; 仅当 Rust 输出有意变更时开发者本地重生成并 commit.
        run: npm run compare:rust

      - name: Probe Rust Wasm ABI
        run: npm run probe:rust:wasm

      - name: Benchmark Rust Wasm (smoke, 5 iterations)
        run: npm run benchmark:rust:wasm -- --iterations 5

      - name: P1 Rust/Wasm perf benchmark (smoke, 3 iterations)
        run: npm run benchmark:compare -- --iterations 3 --no-threshold

      - name: Performance regression gate (per-platform baseline)
        # P1 第 4 项 CI 性能门禁：本平台 perf-data 与 perf-baseline/ci/<os>.json
        # 比对，Rust p50/nav batch 回归 > 10% 或 fallback > 0 即 fail。
        # 基线文件缺失时 notice 跳过（首次采集后由开发者把 CI artifact
        # benchmark-<os>.json 提交到 perf-baseline/ci/，从下一个 run 起
        # 门禁生效）。Linux runner ≠ dev machine 速度基线，因此基线按
        # runner 平台分文件维护，不与本机 dev 阈值混用。
        run: |
          BASELINE="perf-baseline/ci/${{ matrix.os }}.json"
          if [ ! -f "$BASELINE" ]; then
            echo "::notice::No CI perf baseline at $BASELINE; skipping strict perf gate. Capture benchmark-<os>.json from the perf-data artifact of this run and commit it to enable the gate."
            exit 0
          fi
          node scripts/benchmarkCompare.js --iterations 5 --no-threshold --json > perf-data/benchmark-${{ matrix.os }}.json
          node scripts/comparePerfData.js --baseline "$BASELINE" perf-data/benchmark-${{ matrix.os }}.json --strict
        shell: bash

      - name: Capture P1 perf data as GitHub artifact
        # P1 第 3 项 真实性能数据采集：把 benchmark 输出归档为 ${{ matrix.os }}
        # 资产，便于跨平台对比与未来回归阈值设定时回看历史数据。本步骤非
        # 门禁——只把 stdout 串成 json 写入文件便于 download。
        # 直接调 node（不走 npm 包装）避免 npm 输出的 banner 行污染 JSON。
        if: always()
        run: |
          mkdir -p perf-data
          node scripts/benchmarkCompare.js --iterations 5 --no-threshold --json > perf-data/benchmark-${{ matrix.os }}.json || true
          cat perf-data/benchmark-${{ matrix.os }}.json
        shell: bash

      - name: Upload P1 perf data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-perf-${{ matrix.os }}
          path: perf-data/
          retention-days: 30

  cross-platform-alert:
    # P1 第 3 项 跨平台告警：所有平台完成后下载两平台的 perf-data
    # JSON 用 compare:perf 做交叉对比，把 fallback>0 / regressions 列入
    # notice。本步不阻塞发布，只 reviewer review PR 时在 actions log
    # 看到跨平台差异。
    name: Cross-platform perf alert
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all perf-data artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p1-perf-*
          path: perf-data-zipped
          merge-multiple: false

      - name: Flatten perf-data files for compare:perf
        # `actions/download-artifact@v4` with `merge-multiple: false` puts each
        # artifact in its own subdirectory; flatten to a single dir so the
        # compare:perf tool can take positional args. Use a shell loop instead
        # of `-exec` to avoid YAML/block-scalar escape pitfalls.
        run: |
          mkdir -p perf-data
          while IFS= read -r -d '' f; do
            cp "$f" "perf-data/$(basename "$f")"
          done < <(find perf-data-zipped -name '*.json' -print0)
          ls -la perf-data/

      - name: Run cross-platform perf comparison
        run: |
          FILES=$(find perf-data -name 'benchmark-*.json' | sort)
          if [ -z "$FILES" ]; then
            echo "::notice::No perf-data files captured; skipping cross-platform comparison."
            exit 0
          fi
          node scripts/comparePerfData.js $FILES

      - name: Report matrix status
        run: |
          echo "::notice::Rust/Wasm matrix completed; check build-and-verify jobs for per-platform status."
          if [ "${{ needs.build-and-verify.result }}" != "success" ]; then
            echo "::warning::At least one platform matrix entry failed; investigate the build-and-verify job logs."
          fi
