name: Release VSIX

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v2.6.4'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run check:release -- --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: 3.x release-readiness gate (--strict)
        # 对照 docs/3.x-Rust-Wasm切换剩余任务规划.md §5「完成定义」7 项门禁。
        # 任一 FAIL 即 fail release workflow；SKIP（tag/asset 一致性）等待
        # release 流程本身跑完后由 check:release 验证。
        run: npm run check:release:readiness -- --strict

      - name: 诊断规则科学化治理 (HARD 阻塞, SOFT informational)
        # 对照 docs/迭代优化计划.md §4 + docs/macro-knowledge/诊断规则科学化工作流.md。
        # 默认模式: HARD (JS+Rust+parity 文档) 任一缺失即 fail; SOFT (DIAGNOSTIC_HELP 文案) 缺口仍存在, 只作 informational warning 不阻塞发布, 由 user 单独推进补文案。
        # 等 SOFT 全部补齐 (SOFT=0) 后再把 mode 升到 --strict 作 strict 发布门禁。
        run: npm run check:diagnostic-governance

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run VS Code integration tests
        run: xvfb-run -a npm run test:integration

      - name: Upload VS Code integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-release-integration-logs
          path: |
            .vscode-test/user-data/logs/**
            .vscode-test/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package VSIX
        run: npm run package

      - name: Run installed VSIX smoke
        # Phase 2.3: 在 Package VSIX 后、Publish GitHub Release 前跑
        # 安装级 smoke：scripts/runInstalledSmoke.js 下载真实 VS Code、
        # 在隔离 user-data/extensions profile 下 --force 安装刚打包的 VSIX、
        # 跑 tests/integration/installedSmokeSuite 验证扩展激活 +
        # rust-wasm backend 实例化成功 + 版本号匹配。CI runner 是 Ubuntu，
        # runExtensionHost 起真实 VS Code 需 display，与 npm run test:integration
        # 一致用 xvfb-run -a 包一层。失败即 fail release workflow、不 publish VSIX。
        run: xvfb-run -a npm run smoke:installed

      - name: Upload installed VSIX smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-release-smoke-logs
          path: |
            .vscode-test/user-data/logs/**
            .vscode-test/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate release notes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');

          const inputTag = process.env.RELEASE_TAG;
          const version = inputTag.replace(/^v/, '');
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex(line => line.startsWith(`## ${version} `));

          if (start < 0) {
            throw new Error(`CHANGELOG section for ${inputTag} was not found.`);
          }

          let end = lines.length;
          for (let i = start + 1; i < lines.length; i++) {
            if (lines[i].startsWith('## ')) {
              end = i;
              break;
            }
          }

          const body = lines.slice(start + 1, end).join('\n').trim();

          if (!body) {
            throw new Error(`CHANGELOG section for ${inputTag} is empty.`);
          }

          // Phase 2.6: 把 VSIX SHA-256 + 字节数 append 到 release body 末尾
          // 作为「## VSIX 校验值」段，让用户安装后可用 Get-FileHash / sha256sum
          // 比对。该段在 npm run package 之后、本 step 之前已生成 VSIX 文件。
          const vsixPath = path.join(process.cwd(), `syntec-macro-${version}.vsix`);
          let vsixSection = '';
          if (fs.existsSync(vsixPath)) {
            const vsixBytes = fs.readFileSync(vsixPath);
            const sha256 = crypto.createHash('sha256').update(vsixBytes).digest('hex');
            vsixSection = `\n\n---\n\n## VSIX 校验值\n\n- 文件名： \`${path.basename(vsixPath)}\`\n- 字节数： ${vsixBytes.length}\n- SHA-256： \`${sha256}\`\n\n安装后可用 PowerShell \`Get-FileHash <path> -Algorithm SHA256\` 或 Linux/macOS \`sha256sum <path>\` 比对。\n`;
          }

          fs.writeFileSync('release-notes.md', body + vsixSection + '\n', 'utf8');
          NODE
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: syntec-macro-*.vsix
          fail_on_unmatched_files: true
